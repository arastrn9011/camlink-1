name: Build PC exe
on: [push, workflow_dispatch]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy pyvirtualcam customtkinter pyinstaller
      - name: adb indir
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath .
      - name: exe derle
        shell: pwsh
        run: pyinstaller --noconfirm --onefile --windowed --name CamLink --collect-all customtkinter --collect-all pyvirtualcam --add-binary "platform-tools/adb.exe;platform-tools" --add-binary "platform-tools/AdbWinApi.dll;platform-tools" --add-binary "platform-tools/AdbWinUsbApi.dll;platform-tools" pc/camlink_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: CamLink-PC
          path: dist/CamLink.exe
